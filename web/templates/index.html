<!DOCTYPE html>
<html>

<head>
    <title>DFA Tester</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
</head>

<body class="row col-12 col-lg-6 m-auto card p-4 mt-5">
    <form method="POST" enctype="multipart/form-data" class=" m-auto ">
        <h3>Regex → DFA Tester</h3>
        <label class="form-label">Arquivo de definições (regex)</label>
        <input type="file" class="form-control" name="definitions"><br><br>
<!-- 
        <h3>Arquivo de testes</h3>
        <input type="file" name="tests"><br><br> -->

        <button type="submit" class="btn btn-success">Executar</button>
    </form>

    {% if result is not none %}
    <h2>Resultado:</h2>
    <p>
        {% if result %}
        ✅ Aceito
        {% else %}
        ❌ Rejeitado
        {% endif %}
    </p>
    {% endif %}

</body>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM"
    crossorigin="anonymous"></script>

</html>
